name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run bundle
      - run: node scripts/generate-openapi.mjs
      - run: node scripts/verify-package.mjs
      - run: tar -czf build/paseo-bridge-linux-node.tar.gz -C build paseo-bridge.mjs paseo-bridge-server.mjs openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-bridge-node-${{ matrix.node }}
          path: build/paseo-bridge-linux-node.tar.gz
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable runtime image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker build --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label org.opencontainers.image.revision="$GITHUB_SHA" --tag "$IMAGE" .
          docker run --rm "$IMAGE" --help
          docker run --rm --entrypoint paseo-bridge "$IMAGE" --help
      - name: Publish verified image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
